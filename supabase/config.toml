# Configuração mínima do projeto Supabase local.
# Gerado manualmente — alinhado com o que `supabase init` cria.
# Veja https://supabase.com/docs/reference/cli/config para todas as opções.

project_id = "sobra"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = false       # MEI passa por magic link, não confirma e-mail separado
double_confirm_changes = true

# Magic link tem TTL curto por segurança
[auth.email.template.magic_link]
subject = "Seu link de acesso ao Sobra"

[auth.external.google]
enabled = true
# Preencher via supabase secrets antes do deploy:
# supabase secrets set AUTH_GOOGLE_CLIENT_ID=... AUTH_GOOGLE_SECRET=...
client_id = "env(AUTH_GOOGLE_CLIENT_ID)"
secret = "env(AUTH_GOOGLE_SECRET)"
redirect_uri = ""
